<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU BVH layout benchmark</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 72rem; margin: 2rem auto; padding: 0 1rem 3rem; }
    h1 { font-size: 1.5rem; }
    #status { margin: 1rem 0; }
    button { padding: .55rem .85rem; margin: 0 .5rem .75rem 0; }
    button:disabled { opacity: .55; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #8886; padding: .45rem; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem;
      border: 1px solid #8886; background: #8881; }
    .error { color: #d33; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>WebGPU BVH layout benchmark</h1>
  <p>
    This compares equivalent BVH2, BVH4, and BVH8 software traversals on the
    browser's WebGPU adapter, including float and compressed wide-node layouts.
  </p>
  <p id="status">Preparing benchmark…</p>
  <button id="copy" disabled>Copy JSON report</button>
  <button id="rerun" disabled>Run again</button>
  <div id="summary"></div>
  <pre id="report"></pre>

<script type="module">
const WORKGROUP_SIZE = 64;
const parameters = new URLSearchParams(location.search);
const GRID_SIDE = integerParameter('grid', 128, 16, 256, true);
const LEAF_SIZE = 4;
const RAY_COUNT = integerParameter('rays', 262144, 1024, 1048576);
const REPETITIONS = integerParameter('repetitions', 5, 1, 20);
const SAMPLE_COUNT = integerParameter('samples', 5, 1, 15);
const F32_MAX = 3.402823e38;
const INVALID_REF = 0xffffffff;
const LEAF_REF_BIT = 0x80000000;
const LEAF_START_MASK = 0x00ffffff;
const BINARY_NODE_BYTES = 32;
const WIDE_FLOAT_NODE_BYTES = 80;
const WIDE_QUANTIZED_NODE_BYTES = 64;
const WIDE_Q8_NODE_BYTES = 48;
const BVH8_FLOAT_NODE_BYTES = 160;
const BVH8_Q8_NODE_BYTES = 80;

const statusElement = document.querySelector('#status');
const summaryElement = document.querySelector('#summary');
const reportElement = document.querySelector('#report');
const copyButton = document.querySelector('#copy');
const rerunButton = document.querySelector('#rerun');
let reportText = '';
let running = false;

copyButton.addEventListener('click', async () => {
  await navigator.clipboard.writeText(reportText);
  copyButton.textContent = 'Copied';
  setTimeout(() => { copyButton.textContent = 'Copy JSON report'; }, 1200);
});
rerunButton.addEventListener('click', runBenchmark);

runBenchmark();

function integerParameter(name, fallback, minimum, maximum, powerOfTwo = false) {
  const value = Number(parameters.get(name) ?? fallback);
  if (!Number.isInteger(value) || value < minimum || value > maximum ||
      (powerOfTwo && (value & (value - 1)) !== 0)) {
    throw new RangeError(
      `${name} must be an integer from ${minimum} to ${maximum}` +
      (powerOfTwo ? ' and a power of two.' : '.')
    );
  }
  return value;
}

async function runBenchmark() {
  if (running) return;
  running = true;
  copyButton.disabled = true;
  rerunButton.disabled = true;
  summaryElement.replaceChildren();
  reportElement.textContent = '';
  statusElement.className = '';
  statusElement.textContent = 'Building the synthetic BVH…';
  let device = null;
  try {
    if (!navigator.gpu) {
      throw new Error(
        'WebGPU is unavailable. Open this page on localhost in a WebGPU-capable browser.'
      );
    }
    const adapter = await navigator.gpu.requestAdapter({
      powerPreference: 'high-performance'
    });
    if (!adapter) throw new Error('No WebGPU adapter is available.');
    const timestampQuery = adapter.features.has('timestamp-query');
    device = await adapter.requestDevice({
      requiredFeatures: timestampQuery ? ['timestamp-query'] : []
    });
    const scene = buildScene(GRID_SIDE, LEAF_SIZE);
    const wide4 = buildWideBvh(scene.nodes, scene.root, 4);
    const wide8 = buildWideBvh(scene.nodes, scene.root, 8);
    const maxBinaryStack = scene.maximumDepth + 2;
    const maxWide4Stack = Math.max(8, 4 * (wide4.maximumDepth + 2));
    const maxWide8Stack = Math.max(16, 8 * (wide8.maximumDepth + 2));
    const layouts = [
      {
        id: 'bvh2_f32_32b',
        label: 'BVH2 f32 (32 B/node)',
        nodeBytes: BINARY_NODE_BYTES,
        nodeCount: scene.nodes.length,
        root: scene.root,
        data: packBinaryNodes(scene.nodes),
        shader: binaryShader(maxBinaryStack)
      },
      {
        id: 'bvh4_f32_80b',
        label: 'BVH4 f32 (80 B/node)',
        nodeBytes: WIDE_FLOAT_NODE_BYTES,
        nodeCount: wide4.nodes.length,
        root: wide4.root,
        data: packWideFloatNodes(wide4.nodes),
        shader: wideShader(maxWide4Stack, false)
      },
      {
        id: 'bvh4_u16_64b',
        label: 'BVH4 u16 (64 B/node)',
        nodeBytes: WIDE_QUANTIZED_NODE_BYTES,
        nodeCount: wide4.nodes.length,
        root: wide4.root,
        data: packWideQuantizedNodes(wide4.nodes),
        shader: wideShader(maxWide4Stack, true)
      },
      {
        id: 'bvh4_q8_48b',
        label: 'BVH4 q8-grid (48 B/node)',
        nodeBytes: WIDE_Q8_NODE_BYTES,
        nodeCount: wide4.nodes.length,
        root: wide4.root,
        data: packWideQ8Nodes(wide4.nodes),
        shader: wideQ8Shader(maxWide4Stack)
      },
      {
        id: 'bvh8_f32_160b',
        label: 'BVH8 f32 (160 B/node)',
        nodeBytes: BVH8_FLOAT_NODE_BYTES,
        nodeCount: wide8.nodes.length,
        root: wide8.root,
        data: packBvh8FloatNodes(wide8.nodes),
        shader: bvh8FloatShader(maxWide8Stack)
      },
      {
        id: 'bvh8_q8_80b',
        label: 'BVH8 q8-grid (80 B/node)',
        nodeBytes: BVH8_Q8_NODE_BYTES,
        nodeCount: wide8.nodes.length,
        root: wide8.root,
        data: packBvh8Q8Nodes(wide8.nodes),
        shader: bvh8Q8Shader(maxWide8Stack)
      }
    ];

    statusElement.textContent = 'Creating GPU buffers and pipelines…';
    const primitiveBuffer = createBufferWithData(
      device, scene.primitiveBounds,
      GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
      'BVH benchmark primitive bounds'
    );
    const rayCases = [
      { id: 'coherent', data: createCoherentRays(RAY_COUNT) },
      { id: 'incoherent', data: createIncoherentRays(RAY_COUNT) }
    ];
    for (const rayCase of rayCases) {
      rayCase.buffer = createBufferWithData(
        device, rayCase.data,
        GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        `BVH benchmark ${rayCase.id} rays`
      );
    }
    const outputBytes = RAY_COUNT * 16;
    const outputBuffer = device.createBuffer({
      label: 'BVH benchmark output',
      size: outputBytes,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC
    });
    const readBuffer = device.createBuffer({
      label: 'BVH benchmark readback',
      size: outputBytes,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ
    });

    for (const layout of layouts) {
      layout.nodeBuffer = createBufferWithData(
        device, layout.data,
        GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        layout.label
      );
      layout.uniformBuffer = createBufferWithData(
        device,
        new Uint32Array([RAY_COUNT, layout.root, scene.primitiveCount, 0]),
        GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        `${layout.label} uniforms`
      );
      const module = device.createShaderModule({
        label: `${layout.label} shader`, code: layout.shader
      });
      const compilation = await module.getCompilationInfo();
      const errors = compilation.messages.filter(message =>
        message.type === 'error'
      );
      if (errors.length) {
        throw new Error(errors.map(message =>
          `${message.lineNum}:${message.linePos} ${message.message}`
        ).join('\n'));
      }
      layout.pipeline = await device.createComputePipelineAsync({
        label: `${layout.label} pipeline`,
        layout: 'auto',
        compute: { module, entryPoint: 'traceMain' }
      });
      layout.bindGroups = Object.fromEntries(rayCases.map(rayCase => [
        rayCase.id,
        device.createBindGroup({
          label: `${layout.label} / ${rayCase.id}`,
          layout: layout.pipeline.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: { buffer: rayCase.buffer } },
            { binding: 1, resource: { buffer: primitiveBuffer } },
            { binding: 2, resource: { buffer: layout.nodeBuffer } },
            { binding: 3, resource: { buffer: outputBuffer } },
            { binding: 4, resource: { buffer: layout.uniformBuffer } }
          ]
        })
      ]));
    }

    statusElement.textContent = 'Checking that all layouts return the same hits…';
    const validation = {};
    const averageBoxTests = {};
    for (const rayCase of rayCases) {
      let baseline = null;
      validation[rayCase.id] = {};
      averageBoxTests[rayCase.id] = {};
      for (const layout of layouts) {
        const output = await runAndRead(
          device, layout.pipeline, layout.bindGroups[rayCase.id],
          outputBuffer, readBuffer, outputBytes
        );
        const summary = summarizeOutput(output, RAY_COUNT, baseline);
        if (!baseline) baseline = output;
        validation[rayCase.id][layout.id] = {
          checksum: summary.checksum,
          hitMismatchCount: summary.hitMismatchCount,
          distanceMismatchCount: summary.distanceMismatchCount
        };
        averageBoxTests[rayCase.id][layout.id] = summary.averageBoxTests;
      }
    }

    statusElement.textContent = timestampQuery
      ? 'Benchmarking with GPU timestamps…'
      : 'Benchmarking with synchronized wall-clock timing…';
    const timer = createTimer(device, timestampQuery);
    const combinations = rayCases.flatMap(rayCase => layouts.map(layout => ({
      rayCase, layout, gpuSamples: [], wallSamples: []
    })));

    for (const combination of combinations) {
      await timer.time(
        combination.layout.pipeline,
        combination.layout.bindGroups[combination.rayCase.id], 2
      );
    }
    for (let sample = 0; sample < SAMPLE_COUNT; sample++) {
      const ordered = rotate(combinations, sample * 2);
      for (let index = 0; index < ordered.length; index++) {
        const combination = ordered[(index * 5) % ordered.length];
        const timing = await timer.time(
          combination.layout.pipeline,
          combination.layout.bindGroups[combination.rayCase.id],
          REPETITIONS
        );
        combination.wallSamples.push(timing.wallMs);
        if (timing.gpuMs !== null) {
          combination.gpuSamples.push(timing.gpuMs);
        }
      }
      statusElement.textContent = `Benchmark sample ${sample + 1}/${SAMPLE_COUNT}…`;
      await new Promise(resolve => setTimeout(resolve, 0));
    }

    const results = Object.fromEntries(rayCases.map(rayCase => [
      rayCase.id,
      Object.fromEntries(layouts.map(layout => {
        const combination = combinations.find(value =>
          value.rayCase === rayCase && value.layout === layout
        );
        return [layout.id, {
          gpu: summarizeTimes(combination.gpuSamples),
          wall: summarizeTimes(combination.wallSamples),
          averageBoxTests: averageBoxTests[rayCase.id][layout.id]
        }];
      }))
    ]));
    addRelativeResults(results, layouts);

    const info = adapter.info ?? {};
    const report = {
      benchmark: 'webgpu-bvh-layout-v3',
      generatedAt: new Date().toISOString(),
      browser: navigator.userAgent,
      adapter: {
        vendor: info.vendor ?? null,
        architecture: info.architecture ?? null,
        device: info.device ?? null,
        description: info.description ?? null,
        isFallbackAdapter: adapter.isFallbackAdapter ?? null
      },
      timestampQuery,
      config: {
        gridSide: GRID_SIDE,
        primitiveCount: scene.primitiveCount,
        leafSize: LEAF_SIZE,
        rayCount: RAY_COUNT,
        repetitions: REPETITIONS,
        sampleCount: SAMPLE_COUNT,
        workgroupSize: WORKGROUP_SIZE
      },
      layouts: Object.fromEntries(layouts.map(layout => [layout.id, {
        label: layout.label,
        nodeCount: layout.nodeCount,
        nodeBytes: layout.nodeBytes,
        hierarchyMiB: layout.nodeCount * layout.nodeBytes / 1048576
      }])),
      validation,
      results,
      primaryTiming: timestampQuery ? 'gpu' : 'wall',
      scope: 'Synthetic AABB traversal microbenchmark; excludes curve intersection and formula evaluation.'
    };
    reportText = JSON.stringify(report, null, 2);
    reportElement.textContent = reportText;
    renderSummary(report, layouts);
    statusElement.textContent = 'Finished. Copy the JSON report and paste it back.';
    copyButton.disabled = false;
    rerunButton.disabled = false;
    device.destroy();
    device = null;
  } catch (error) {
    statusElement.className = 'error';
    statusElement.textContent = `ERROR: ${error?.stack ?? error}`;
    rerunButton.disabled = false;
  } finally {
    device?.destroy();
    running = false;
  }
}

function buildScene(side, leafSize) {
  const nodes = [];
  const primitiveValues = [];
  let maximumDepth = 0;
  const boxScale = 0.55;

  function primitiveBounds(x, y) {
    const margin = (1 - boxScale) * 0.5;
    return {
      minX: Math.fround((x + margin) / side),
      minY: Math.fround((y + margin) / side),
      maxX: Math.fround((x + 1 - margin) / side),
      maxY: Math.fround((y + 1 - margin) / side)
    };
  }

  function build(x0, x1, y0, y1, depth) {
    maximumDepth = Math.max(maximumDepth, depth);
    const count = (x1 - x0) * (y1 - y0);
    if (count <= leafSize) {
      const start = primitiveValues.length / 4;
      let bounds = null;
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const value = primitiveBounds(x, y);
          primitiveValues.push(value.minX, value.minY, value.maxX, value.maxY);
          bounds = bounds ? combineBounds(bounds, value) : value;
        }
      }
      const index = nodes.length;
      nodes.push({ bounds, leaf: true, first: start, second: count });
      return index;
    }
    let left;
    let right;
    if (x1 - x0 >= y1 - y0) {
      const middle = x0 + Math.floor((x1 - x0) / 2);
      left = build(x0, middle, y0, y1, depth + 1);
      right = build(middle, x1, y0, y1, depth + 1);
    } else {
      const middle = y0 + Math.floor((y1 - y0) / 2);
      left = build(x0, x1, y0, middle, depth + 1);
      right = build(x0, x1, middle, y1, depth + 1);
    }
    const index = nodes.length;
    nodes.push({
      bounds: combineBounds(nodes[left].bounds, nodes[right].bounds),
      leaf: false,
      first: left,
      second: right
    });
    return index;
  }

  const root = build(0, side, 0, side, 0);
  return {
    nodes,
    root,
    maximumDepth,
    primitiveBounds: Float32Array.from(primitiveValues),
    primitiveCount: primitiveValues.length / 4
  };
}

function buildWideBvh(binaryNodes, binaryRoot, maximumChildren) {
  if (maximumChildren !== 4 && maximumChildren !== 8) {
    throw new RangeError('Wide BVH nodes must have four or eight children.');
  }
  const nodes = [];
  let maximumDepth = 0;

  function convert(binaryIndex, depth) {
    maximumDepth = Math.max(maximumDepth, depth);
    const root = binaryNodes[binaryIndex];
    if (root.leaf) throw new Error('The benchmark root unexpectedly became a leaf.');
    const frontier = [root.first, root.second];
    while (frontier.length < maximumChildren) {
      let expandAt = -1;
      let largestArea = -1;
      frontier.forEach((index, position) => {
        const node = binaryNodes[index];
        if (!node.leaf) {
          const width = node.bounds.maxX - node.bounds.minX;
          const height = node.bounds.maxY - node.bounds.minY;
          const area = width * height;
          if (area > largestArea) {
            largestArea = area;
            expandAt = position;
          }
        }
      });
      if (expandAt < 0) break;
      const expanded = binaryNodes[frontier[expandAt]];
      frontier.splice(expandAt, 1, expanded.first, expanded.second);
    }

    const children = frontier.map(index => {
      const node = binaryNodes[index];
      if (node.leaf) {
        if (node.first > LEAF_START_MASK || node.second > 0x7f) {
          throw new RangeError('Leaf reference does not fit the benchmark format.');
        }
        return {
          bounds: node.bounds,
          ref: (LEAF_REF_BIT | (node.second << 24) | node.first) >>> 0
        };
      }
      return { bounds: node.bounds, ref: convert(index, depth + 1) };
    });
    const wideIndex = nodes.length;
    nodes.push({ bounds: root.bounds, children });
    return wideIndex;
  }

  return { root: convert(binaryRoot, 0), nodes, maximumDepth };
}

function combineBounds(a, b) {
  return {
    minX: Math.min(a.minX, b.minX), minY: Math.min(a.minY, b.minY),
    maxX: Math.max(a.maxX, b.maxX), maxY: Math.max(a.maxY, b.maxY)
  };
}

function packBinaryNodes(nodes) {
  const data = new ArrayBuffer(nodes.length * BINARY_NODE_BYTES);
  const view = new DataView(data);
  nodes.forEach((node, index) => {
    const offset = index * BINARY_NODE_BYTES;
    writeBounds(view, offset, node.bounds);
    view.setUint32(offset + 16, node.first, true);
    view.setUint32(offset + 20, node.second, true);
    view.setUint32(offset + 24, 0, true);
    view.setUint32(offset + 28, node.leaf ? 1 : 0, true);
  });
  return data;
}

function packWideFloatNodes(nodes) {
  const data = new ArrayBuffer(nodes.length * WIDE_FLOAT_NODE_BYTES);
  const view = new DataView(data);
  nodes.forEach((node, nodeIndex) => {
    const offset = nodeIndex * WIDE_FLOAT_NODE_BYTES;
    for (let childIndex = 0; childIndex < 4; childIndex++) {
      const child = node.children[childIndex];
      view.setFloat32(offset + childIndex * 4, child?.bounds.minX ?? 0, true);
      view.setFloat32(offset + 16 + childIndex * 4, child?.bounds.minY ?? 0, true);
      view.setFloat32(offset + 32 + childIndex * 4, child?.bounds.maxX ?? 0, true);
      view.setFloat32(offset + 48 + childIndex * 4, child?.bounds.maxY ?? 0, true);
      view.setUint32(offset + 64 + childIndex * 4, child?.ref ?? INVALID_REF, true);
    }
  });
  return data;
}

function packBvh8FloatNodes(nodes) {
  const data = new ArrayBuffer(nodes.length * BVH8_FLOAT_NODE_BYTES);
  const view = new DataView(data);
  nodes.forEach((node, nodeIndex) => {
    const offset = nodeIndex * BVH8_FLOAT_NODE_BYTES;
    for (let childIndex = 0; childIndex < 8; childIndex++) {
      const child = node.children[childIndex];
      const groupOffset = childIndex < 4 ? 0 : 16;
      const laneOffset = (childIndex & 3) * 4;
      view.setFloat32(offset + groupOffset + laneOffset,
        child?.bounds.minX ?? 0, true);
      view.setFloat32(offset + 32 + groupOffset + laneOffset,
        child?.bounds.minY ?? 0, true);
      view.setFloat32(offset + 64 + groupOffset + laneOffset,
        child?.bounds.maxX ?? 0, true);
      view.setFloat32(offset + 96 + groupOffset + laneOffset,
        child?.bounds.maxY ?? 0, true);
      view.setUint32(offset + 128 + groupOffset + laneOffset,
        child?.ref ?? INVALID_REF, true);
    }
  });
  return data;
}

function packWideQuantizedNodes(nodes) {
  const data = new ArrayBuffer(nodes.length * WIDE_QUANTIZED_NODE_BYTES);
  const view = new DataView(data);
  nodes.forEach((node, nodeIndex) => {
    const offset = nodeIndex * WIDE_QUANTIZED_NODE_BYTES;
    writeBounds(view, offset, node.bounds);
    const minX = [];
    const minY = [];
    const maxX = [];
    const maxY = [];
    for (let childIndex = 0; childIndex < 4; childIndex++) {
      const child = node.children[childIndex];
      minX.push(child ? quantizeBound(child.bounds.minX, node.bounds.minX,
        node.bounds.maxX, false) : 0);
      minY.push(child ? quantizeBound(child.bounds.minY, node.bounds.minY,
        node.bounds.maxY, false) : 0);
      maxX.push(child ? quantizeBound(child.bounds.maxX, node.bounds.minX,
        node.bounds.maxX, true) : 0);
      maxY.push(child ? quantizeBound(child.bounds.maxY, node.bounds.minY,
        node.bounds.maxY, true) : 0);
      view.setUint32(offset + 48 + childIndex * 4,
        child?.ref ?? INVALID_REF, true);
    }
    view.setUint32(offset + 16, packU16(minX[0], minX[1]), true);
    view.setUint32(offset + 20, packU16(minX[2], minX[3]), true);
    view.setUint32(offset + 24, packU16(minY[0], minY[1]), true);
    view.setUint32(offset + 28, packU16(minY[2], minY[3]), true);
    view.setUint32(offset + 32, packU16(maxX[0], maxX[1]), true);
    view.setUint32(offset + 36, packU16(maxX[2], maxX[3]), true);
    view.setUint32(offset + 40, packU16(maxY[0], maxY[1]), true);
    view.setUint32(offset + 44, packU16(maxY[2], maxY[3]), true);
  });
  return data;
}

function packWideQ8Nodes(nodes) {
  const data = new ArrayBuffer(nodes.length * WIDE_Q8_NODE_BYTES);
  const view = new DataView(data);
  nodes.forEach((node, nodeIndex) => {
    const offset = nodeIndex * WIDE_Q8_NODE_BYTES;
    const originX = Math.fround(node.bounds.minX);
    const originY = Math.fround(node.bounds.minY);
    const gridX = createPowerOfTwoGrid(
      originX, Math.fround(node.bounds.maxX)
    );
    const gridY = createPowerOfTwoGrid(
      originY, Math.fround(node.bounds.maxY)
    );
    view.setFloat32(offset, originX, true);
    view.setFloat32(offset + 4, originY, true);
    view.setUint32(
      offset + 8,
      (gridX.biasedExponent | gridY.biasedExponent << 8) >>> 0,
      true
    );
    view.setUint32(offset + 12, 0, true);

    const minX = [];
    const minY = [];
    const maxX = [];
    const maxY = [];
    for (let childIndex = 0; childIndex < 4; childIndex++) {
      const child = node.children[childIndex];
      minX.push(child ? quantizeGridPlane(
        child.bounds.minX, originX, gridX.scale, false
      ) : 0);
      minY.push(child ? quantizeGridPlane(
        child.bounds.minY, originY, gridY.scale, false
      ) : 0);
      maxX.push(child ? quantizeGridPlane(
        child.bounds.maxX, originX, gridX.scale, true
      ) : 0);
      maxY.push(child ? quantizeGridPlane(
        child.bounds.maxY, originY, gridY.scale, true
      ) : 0);
      view.setUint32(
        offset + 32 + childIndex * 4,
        child?.ref ?? INVALID_REF,
        true
      );
    }
    view.setUint32(offset + 16, packU8x4(minX), true);
    view.setUint32(offset + 20, packU8x4(minY), true);
    view.setUint32(offset + 24, packU8x4(maxX), true);
    view.setUint32(offset + 28, packU8x4(maxY), true);
  });
  return data;
}

function packBvh8Q8Nodes(nodes) {
  const data = new ArrayBuffer(nodes.length * BVH8_Q8_NODE_BYTES);
  const view = new DataView(data);
  nodes.forEach((node, nodeIndex) => {
    const offset = nodeIndex * BVH8_Q8_NODE_BYTES;
    const originX = Math.fround(node.bounds.minX);
    const originY = Math.fround(node.bounds.minY);
    const gridX = createPowerOfTwoGrid(
      originX, Math.fround(node.bounds.maxX)
    );
    const gridY = createPowerOfTwoGrid(
      originY, Math.fround(node.bounds.maxY)
    );
    view.setFloat32(offset, originX, true);
    view.setFloat32(offset + 4, originY, true);
    view.setUint32(
      offset + 8,
      (gridX.biasedExponent | gridY.biasedExponent << 8) >>> 0,
      true
    );
    view.setUint32(offset + 12, 0, true);

    const planes = {
      minX: [], minY: [], maxX: [], maxY: []
    };
    for (let childIndex = 0; childIndex < 8; childIndex++) {
      const child = node.children[childIndex];
      planes.minX.push(child ? quantizeGridPlane(
        child.bounds.minX, originX, gridX.scale, false
      ) : 0);
      planes.minY.push(child ? quantizeGridPlane(
        child.bounds.minY, originY, gridY.scale, false
      ) : 0);
      planes.maxX.push(child ? quantizeGridPlane(
        child.bounds.maxX, originX, gridX.scale, true
      ) : 0);
      planes.maxY.push(child ? quantizeGridPlane(
        child.bounds.maxY, originY, gridY.scale, true
      ) : 0);
      view.setUint32(
        offset + 48 + childIndex * 4,
        child?.ref ?? INVALID_REF,
        true
      );
    }
    for (let group = 0; group < 2; group++) {
      const planeOffset = offset + 16 + group * 16;
      const start = group * 4;
      const end = start + 4;
      view.setUint32(planeOffset,
        packU8x4(planes.minX.slice(start, end)), true);
      view.setUint32(planeOffset + 4,
        packU8x4(planes.minY.slice(start, end)), true);
      view.setUint32(planeOffset + 8,
        packU8x4(planes.maxX.slice(start, end)), true);
      view.setUint32(planeOffset + 12,
        packU8x4(planes.maxY.slice(start, end)), true);
    }
  });
  return data;
}

function createPowerOfTwoGrid(minimum, maximum) {
  const extent = maximum - minimum;
  if (!(extent > 0)) return { scale: 2 ** -126, biasedExponent: 1 };
  let exponent = Math.ceil(Math.log2(extent / 255));
  exponent = Math.max(-126, Math.min(127, exponent));
  let scale = 2 ** exponent;
  while (extent / scale > 255 && exponent < 127) {
    exponent++;
    scale *= 2;
  }
  return { scale, biasedExponent: exponent + 127 };
}

function quantizeGridPlane(value, origin, scale, upper) {
  const position = (Math.fround(value) - origin) / scale;
  const quantized = upper ? Math.ceil(position) : Math.floor(position);
  return Math.max(0, Math.min(255, quantized));
}

function packU8x4(values) {
  return (
    (values[0] & 0xff) |
    (values[1] & 0xff) << 8 |
    (values[2] & 0xff) << 16 |
    (values[3] & 0xff) << 24
  ) >>> 0;
}

function quantizeBound(value, parentMin, parentMax, upper) {
  const extent = parentMax - parentMin;
  if (!(extent > 0)) return upper ? 65535 : 0;
  const scaled = (value - parentMin) / extent * 65535;
  const rounded = upper ? Math.ceil(scaled) + 1 : Math.floor(scaled) - 1;
  return Math.max(0, Math.min(65535, rounded));
}

function packU16(low, high) {
  return ((low & 0xffff) | ((high & 0xffff) << 16)) >>> 0;
}

function writeBounds(view, offset, bounds) {
  view.setFloat32(offset, bounds.minX, true);
  view.setFloat32(offset + 4, bounds.minY, true);
  view.setFloat32(offset + 8, bounds.maxX, true);
  view.setFloat32(offset + 12, bounds.maxY, true);
}

function createCoherentRays(count) {
  const values = new Float32Array(count * 4);
  for (let index = 0; index < count; index++) {
    const group = Math.floor(index / WORKGROUP_SIZE);
    const lane = index % WORKGROUP_SIZE;
    const baseY = (hash32(group + 1) + 0.5) / 4294967296;
    const jitter = (lane - 31.5) * 0.0000025;
    const directionY = (lane - 31.5) * 0.000004;
    values[index * 4] = -0.25;
    values[index * 4 + 1] = Math.max(0.0001, Math.min(0.9999, baseY + jitter));
    values[index * 4 + 2] = 1;
    values[index * 4 + 3] = directionY;
  }
  return values;
}

function createIncoherentRays(count) {
  const values = new Float32Array(count * 4);
  for (let index = 0; index < count; index++) {
    const angle = random01(index * 4 + 1) * Math.PI * 2;
    const originX = 0.5 + Math.cos(angle) * 1.1;
    const originY = 0.5 + Math.sin(angle) * 1.1;
    const targetX = random01(index * 4 + 2);
    const targetY = random01(index * 4 + 3);
    const dx = targetX - originX;
    const dy = targetY - originY;
    const inverseLength = 1 / Math.hypot(dx, dy);
    values[index * 4] = originX;
    values[index * 4 + 1] = originY;
    values[index * 4 + 2] = dx * inverseLength;
    values[index * 4 + 3] = dy * inverseLength;
  }
  return values;
}

function random01(seed) {
  return (hash32(seed) + 0.5) / 4294967296;
}

function hash32(value) {
  value = Math.imul(value ^ 0x9e3779b9, 0x85ebca6b);
  value ^= value >>> 13;
  value = Math.imul(value, 0xc2b2ae35);
  return (value ^ (value >>> 16)) >>> 0;
}

function commonShaderDeclarations() {
  return `
const F32_MAX:f32=${F32_MAX};
const INVALID_REF:u32=0xffffffffu;
const LEAF_REF_BIT:u32=0x80000000u;
struct Ray { origin:vec2f, direction:vec2f };
struct TraceResult { hit:u32, distance:f32, boxTests:u32, padding:u32 };
struct Config { rayCount:u32, root:u32, primitiveCount:u32, padding:u32 };
@group(0) @binding(0) var<storage,read> rays:array<Ray>;
@group(0) @binding(1) var<storage,read> primitives:array<vec4f>;
@group(0) @binding(3) var<storage,read_write> results:array<TraceResult>;
@group(0) @binding(4) var<uniform> config:Config;

fn boundsNear(ray:Ray,bounds:vec4f)->f32 {
  var nearValue=-F32_MAX;
  var farValue=F32_MAX;
  if(ray.direction.x==0.0){
    if(ray.origin.x<bounds.x||ray.origin.x>bounds.z){return F32_MAX;}
  }else{
    let values=(bounds.xz-vec2f(ray.origin.x))/ray.direction.x;
    nearValue=max(nearValue,min(values.x,values.y));
    farValue=min(farValue,max(values.x,values.y));
  }
  if(ray.direction.y==0.0){
    if(ray.origin.y<bounds.y||ray.origin.y>bounds.w){return F32_MAX;}
  }else{
    let values=(bounds.yw-vec2f(ray.origin.y))/ray.direction.y;
    nearValue=max(nearValue,min(values.x,values.y));
    farValue=min(farValue,max(values.x,values.y));
  }
  return select(F32_MAX,max(nearValue,0.0),nearValue<=farValue&&farValue>0.0);
}

fn intersectLeaf(start:u32,count:u32,ray:Ray,current:TraceResult)->TraceResult {
  var result=current;
  for(var offset=0u;offset<count;offset++){
    let primitiveIndex=start+offset;
    if(primitiveIndex>=config.primitiveCount){break;}
    let nearValue=boundsNear(ray,primitives[primitiveIndex]);
    result.boxTests+=1u;
    if(nearValue<result.distance){
      result.distance=nearValue;
      result.hit=primitiveIndex;
    }
  }
  return result;
}
`;
}

function binaryShader(stackSize) {
  return `${commonShaderDeclarations()}
struct BvhNode { bounds:vec4f, first:u32, second:u32, mask:u32, flags:u32 };
@group(0) @binding(2) var<storage,read> nodes:array<BvhNode>;

@compute @workgroup_size(${WORKGROUP_SIZE})
fn traceMain(@builtin(global_invocation_id) invocation:vec3u){
  let rayIndex=invocation.x;
  if(rayIndex>=config.rayCount){return;}
  let ray=rays[rayIndex];
  var result=TraceResult(0xffffffffu,F32_MAX,0u,0u);
  var stack:array<u32,${stackSize}>;
  var stackCount=1u;
  stack[0]=config.root;
  loop{
    if(stackCount==0u){break;}
    stackCount-=1u;
    let nodeIndex=stack[stackCount];
    let node=nodes[nodeIndex];
    let nodeNear=boundsNear(ray,node.bounds);
    result.boxTests+=1u;
    if(nodeNear==F32_MAX||nodeNear>result.distance){continue;}
    if((node.flags&1u)!=0u){
      result=intersectLeaf(node.first,node.second,ray,result);
    }else{
      let leftNear=boundsNear(ray,nodes[node.first].bounds);
      let rightNear=boundsNear(ray,nodes[node.second].bounds);
      result.boxTests+=2u;
      if(leftNear!=F32_MAX&&rightNear!=F32_MAX&&
          leftNear<=result.distance&&rightNear<=result.distance){
        if(leftNear<=rightNear){
          stack[stackCount]=node.second;
          stack[stackCount+1u]=node.first;
        }else{
          stack[stackCount]=node.first;
          stack[stackCount+1u]=node.second;
        }
        stackCount+=2u;
      }else if(leftNear!=F32_MAX&&leftNear<=result.distance){
        stack[stackCount]=node.first;stackCount+=1u;
      }else if(rightNear!=F32_MAX&&rightNear<=result.distance){
        stack[stackCount]=node.second;stackCount+=1u;
      }
    }
  }
  results[rayIndex]=result;
}`;
}

    let second=maxX*scaledInverse+vec4f(originTerm);
    nearValue=max(nearValue,min(first,second));
    farValue=min(farValue,max(first,second));
  }
  if(ray.direction.y==0.0){
    let rayOrigin=vec4f(ray.origin.y);
    let inside=(rayOrigin>=vec4f(origin.y)+minY*scaleY)&
      (rayOrigin<=vec4f(origin.y)+maxY*scaleY);
    farValue=select(vec4f(-F32_MAX),farValue,inside);
  }else{
    let scaledInverse=scaleY/ray.direction.y;
    let originTerm=(origin.y-ray.origin.y)/ray.direction.y;
    let first=minY*scaledInverse+vec4f(originTerm);
    let second=maxY*scaledInverse+vec4f(originTerm);
    nearValue=max(nearValue,min(first,second));
    farValue=min(farValue,max(first,second));
  }
  let valid=(nearValue<=farValue)&(farValue>vec4f(0.0));
  return select(vec4f(F32_MAX),max(nearValue,vec4f(0.0)),valid);
}

@compute @workgroup_size(${WORKGROUP_SIZE})
fn traceMain(@builtin(global_invocation_id) invocation:vec3u){
  let rayIndex=invocation.x;
  if(rayIndex>=config.rayCount){return;}
  let ray=rays[rayIndex];
  var result=TraceResult(0xffffffffu,F32_MAX,0u,0u);
  var stackRefs:array<u32,${stackSize}>;
  var stackNear:array<f32,${stackSize}>;
  var stackCount=1u;
  stackRefs[0]=config.root;stackNear[0]=0.0;
  loop{
    if(stackCount==0u){break;}
    stackCount-=1u;
    let reference=stackRefs[stackCount];
    if(stackNear[stackCount]>result.distance){continue;}
    if((reference&LEAF_REF_BIT)!=0u){
      let start=reference&0x00ffffffu;
      let count=(reference>>24u)&0x7fu;
      result=intersectLeaf(start,count,ray,result);
      continue;
    }
    let node=nodes[reference];
    let near0=boundsNearQ8Bvh8(
      ray,node.origin,node.exponents,node.qBounds0
    );
    let near1=boundsNearQ8Bvh8(
      ray,node.origin,node.exponents,node.qBounds1
    );
    result.boxTests+=8u;
    var orderedRefs:array<u32,8>;
    var orderedNear:array<f32,8>;
    var orderedCount=0u;
    for(var child=0u;child<8u;child++){
      var childRef=INVALID_REF;
      var childNear=F32_MAX;
      if(child<4u){
        childRef=node.refs0[child];childNear=near0[child];
      }else{
        childRef=node.refs1[child-4u];childNear=near1[child-4u];
      }
      if(childRef==INVALID_REF||childNear==F32_MAX||
          childNear>result.distance){continue;}
      var position=orderedCount;
      loop{
        if(position==0u||orderedNear[position-1u]>=childNear){break;}
        orderedNear[position]=orderedNear[position-1u];
        orderedRefs[position]=orderedRefs[position-1u];
        position-=1u;
      }
      orderedNear[position]=childNear;
      orderedRefs[position]=childRef;
      orderedCount+=1u;
    }
    for(var child=0u;child<orderedCount;child++){
      stackRefs[stackCount]=orderedRefs[child];
      stackNear[stackCount]=orderedNear[child];
      stackCount+=1u;
    }
  }
  results[rayIndex]=result;
}`;
}

function createBufferWithData(device, data, usage, label) {
  const byteLength = Math.max(4, Math.ceil(data.byteLength / 4) * 4);
  const buffer = device.createBuffer({ label, size: byteLength, usage });
  device.queue.writeBuffer(buffer, 0, data);
  return buffer;
}

async function runAndRead(
  device, pipeline, bindGroup, outputBuffer, readBuffer, outputBytes
) {
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(RAY_COUNT / WORKGROUP_SIZE));
  pass.end();
  encoder.copyBufferToBuffer(outputBuffer, 0, readBuffer, 0, outputBytes);
  device.queue.submit([encoder.finish()]);
  await readBuffer.mapAsync(GPUMapMode.READ);
  const copy = readBuffer.getMappedRange().slice(0);
  readBuffer.unmap();
  return copy;
}

function summarizeOutput(output, count, baseline) {
  const words = new Uint32Array(output);
  const baselineWords = baseline ? new Uint32Array(baseline) : null;
  let checksum = 2166136261;
  let boxTests = 0;
  let hitMismatchCount = 0;
  let distanceMismatchCount = 0;
  for (let index = 0; index < count; index++) {
    const offset = index * 4;
    const hit = words[offset];
    boxTests += words[offset + 2];
    checksum = Math.imul(checksum ^ hit, 16777619) >>> 0;
    checksum = Math.imul(checksum ^ words[offset + 1], 16777619) >>> 0;
    if (baselineWords && hit !== baselineWords[offset]) hitMismatchCount++;
    if (baselineWords && words[offset + 1] !== baselineWords[offset + 1]) {
      distanceMismatchCount++;
    }
  }
  return {
    checksum: checksum.toString(16).padStart(8, '0'),
    averageBoxTests: boxTests / count,
    hitMismatchCount,
    distanceMismatchCount
  };
}

function createTimer(device, timestampQuery) {
  const querySet = timestampQuery
    ? device.createQuerySet({ type: 'timestamp', count: 2 }) : null;
  const resolveBuffer = timestampQuery ? device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC
  }) : null;
  const readBuffer = timestampQuery ? device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ
  }) : null;
  return {
    async time(pipeline, bindGroup, repetitions) {
      const encoder = device.createCommandEncoder();
      const descriptor = timestampQuery ? { timestampWrites: {
        querySet,
        beginningOfPassWriteIndex: 0,
        endOfPassWriteIndex: 1
      } } : undefined;
      const pass = encoder.beginComputePass(descriptor);
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      for (let index = 0; index < repetitions; index++) {
        pass.dispatchWorkgroups(Math.ceil(RAY_COUNT / WORKGROUP_SIZE));
      }
      pass.end();
      if (timestampQuery) {
        encoder.resolveQuerySet(querySet, 0, 2, resolveBuffer, 0);
        encoder.copyBufferToBuffer(resolveBuffer, 0, readBuffer, 0, 16);
      }
      const start = performance.now();
      device.queue.submit([encoder.finish()]);
      await device.queue.onSubmittedWorkDone();
      const wallMs = (performance.now() - start) / repetitions;
      let gpuMs = null;
      if (timestampQuery) {
        await readBuffer.mapAsync(GPUMapMode.READ);
        const values = new BigUint64Array(readBuffer.getMappedRange().slice(0));
        readBuffer.unmap();
        gpuMs = Number(values[1] - values[0]) / 1e6 / repetitions;
      }
      return { wallMs, gpuMs };
    }
  };
}

function summarizeTimes(samples) {
  if (!samples.length) return null;
  const sorted = [...samples].sort((a, b) => a - b);
  const medianMs = sorted[Math.floor(sorted.length / 2)];
  return {
    medianMs,
    minimumMs: sorted[0],
    maximumMs: sorted.at(-1),
    samplesMs: sorted,
    millionRaysPerSecond: RAY_COUNT / medianMs / 1000
  };
}

function addRelativeResults(results, layouts) {
  for (const rayResults of Object.values(results)) {
    const timingName = rayResults[layouts[0].id].gpu ? 'gpu' : 'wall';
    const baseline = rayResults[layouts[0].id][timingName].medianMs;
    for (const layout of layouts) {
      const result = rayResults[layout.id];
      result.speedupVsBvh2 = baseline / result[timingName].medianMs;
    }
    const bvh4Float = rayResults.bvh4_f32_80b[timingName].medianMs;
    for (const layout of layouts) {
      const result = rayResults[layout.id];
      result.speedupVsFloatBvh4 =
        bvh4Float / result[timingName].medianMs;
    }
    for (const layoutId of ['bvh4_u16_64b', 'bvh4_q8_48b']) {
      rayResults[layoutId].speedupVsUncompressedBvh4 =
        bvh4Float / rayResults[layoutId][timingName].medianMs;
      rayResults[layoutId].speedupVsUncompressedSameWidth =
        rayResults[layoutId].speedupVsUncompressedBvh4;
    }
    const bvh8Float = rayResults.bvh8_f32_160b[timingName].medianMs;
    rayResults.bvh8_q8_80b.speedupVsUncompressedBvh8 =
      bvh8Float / rayResults.bvh8_q8_80b[timingName].medianMs;
    rayResults.bvh8_q8_80b.speedupVsUncompressedSameWidth =
      rayResults.bvh8_q8_80b.speedupVsUncompressedBvh8;
    rayResults.bvh8_f32_160b.speedupVsMatchingBvh4 =
      bvh4Float / bvh8Float;
    rayResults.bvh8_q8_80b.speedupVsMatchingBvh4 =
      rayResults.bvh4_q8_48b[timingName].medianMs /
      rayResults.bvh8_q8_80b[timingName].medianMs;
  }
}

function rotate(values, offset) {
  const amount = offset % values.length;
  return [...values.slice(amount), ...values.slice(0, amount)];
}

function renderSummary(report, layouts) {
  const timing = report.primaryTiming;
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>Rays</th><th>Layout</th>` +
    `<th>${timing} median ms</th><th>M rays/s</th><th>vs BVH2</th>` +
    `<th>vs float BVH4</th><th>avg box tests</th></tr></thead>`;
  const body = document.createElement('tbody');
  for (const rayCase of ['coherent', 'incoherent']) {
    for (const layout of layouts) {
      const value = report.results[rayCase][layout.id];
      const measured = value[timing];
      const row = document.createElement('tr');
      row.innerHTML = `<td>${rayCase}</td><td>${layout.label}</td>` +
        `<td>${measured.medianMs.toFixed(3)}</td>` +
        `<td>${measured.millionRaysPerSecond.toFixed(2)}</td>` +
        `<td>${value.speedupVsBvh2.toFixed(3)}×</td>` +
        `<td>${value.speedupVsFloatBvh4.toFixed(3)}×</td>` +
        `<td>${value.averageBoxTests.toFixed(1)}</td>`;
      body.append(row);
    }
  }
  table.append(body);
  summaryElement.append(table);
}
