<!doctype html>
<meta charset="utf-8">
<title>WebGPU ray-buffer clear benchmark</title>
<body>running</body>
<script type="module">
const params = new URLSearchParams(location.search);
const capacity = Number(params.get('capacity') ?? 1048576);
const repetitions = Number(params.get('repetitions') ?? 32);
const sampleCount = Number(params.get('samples') ?? 5);
const workgroupSize = 64;
const rayBytes = 32;
const dirtySlots = [
  0, 64, 1024, 16384, 65536, 262144, capacity
].filter((value, index, values) =>
  value <= capacity && values.indexOf(value) === index
);

try {
  if (!navigator.gpu) throw new Error('WebGPU is unavailable.');
  const adapter = await navigator.gpu.requestAdapter({
    powerPreference: 'high-performance'
  });
  if (!adapter) throw new Error('No WebGPU adapter is available.');
  const hasTimestampQuery = adapter.features.has('timestamp-query');
  const device = await adapter.requestDevice({
    requiredFeatures: hasTimestampQuery ? ['timestamp-query'] : []
  });
  const rayBuffer = device.createBuffer({
    size: capacity * rayBytes,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
  });
  const indirectBuffer = device.createBuffer({
    size: 12,
    usage: GPUBufferUsage.INDIRECT | GPUBufferUsage.COPY_DST
  });
  const module = device.createShaderModule({ code: `
struct Ray {
  origin: vec2f,
  direction: vec2f,
  powers: vec2f,
  wavelength: f32,
  flags: u32,
};
@group(0) @binding(0) var<storage, read_write> rays: array<Ray>;
@compute @workgroup_size(${workgroupSize})
fn clearFlags(@builtin(global_invocation_id) id: vec3u) {
  if (id.x < ${capacity}u) { rays[id.x].flags = 0u; }
}
` });
  const compilation = await module.getCompilationInfo();
  const shaderErrors = compilation.messages.filter(value =>
    value.type === 'error'
  );
  if (shaderErrors.length > 0) {
    throw new Error(shaderErrors.map(value => value.message).join('\n'));
  }
  const pipeline = await device.createComputePipelineAsync({
    layout: 'auto',
    compute: { module, entryPoint: 'clearFlags' }
  });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: rayBuffer } }]
  });
  const querySet = hasTimestampQuery ? device.createQuerySet({
    type: 'timestamp', count: 2
  }) : null;
  const queryResolveBuffer = hasTimestampQuery ? device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC
  }) : null;
  const queryReadBuffer = hasTimestampQuery ? device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ
  }) : null;

  async function timeCommands(encode) {
    const wallSamples = [];
    const gpuSamples = [];
    for (let sample = -1; sample < sampleCount; sample++) {
      const encoder = device.createCommandEncoder();
      encode(encoder, querySet);
      if (hasTimestampQuery) {
        encoder.resolveQuerySet(querySet, 0, 2, queryResolveBuffer, 0);
        encoder.copyBufferToBuffer(
          queryResolveBuffer, 0, queryReadBuffer, 0, 16
        );
      }
      const commandBuffer = encoder.finish();
      const start = performance.now();
      device.queue.submit([commandBuffer]);
      await device.queue.onSubmittedWorkDone();
      let gpuMs = null;
      if (hasTimestampQuery) {
        await queryReadBuffer.mapAsync(GPUMapMode.READ);
        const values = new BigUint64Array(
          queryReadBuffer.getMappedRange().slice(0)
        );
        queryReadBuffer.unmap();
        gpuMs = Number(values[1] - values[0]) / 1e6 / repetitions;
      }
      const wallMs = (performance.now() - start) / repetitions;
      if (sample >= 0) {
        wallSamples.push(wallMs);
        if (gpuMs !== null) gpuSamples.push(gpuMs);
      }
    }
    wallSamples.sort((a, b) => a - b);
    gpuSamples.sort((a, b) => a - b);
    return {
      wall: summarize(wallSamples),
      gpu: hasTimestampQuery ? summarize(gpuSamples) : null
    };
  }

  function summarize(samples) {
    return {
      medianMs: samples[Math.floor(samples.length / 2)],
      samplesMs: samples
    };
  }

  function beginTimestampRange(encoder, timestamps) {
    if (!timestamps) return;
    const pass = encoder.beginComputePass({ timestampWrites: {
      querySet: timestamps,
      endOfPassWriteIndex: 0
    } });
    pass.end();
  }

  function endTimestampRange(encoder, timestamps) {
    if (!timestamps) return;
    const pass = encoder.beginComputePass({ timestampWrites: {
      querySet: timestamps,
      beginningOfPassWriteIndex: 1
    } });
    pass.end();
  }

  const fullNative = await timeCommands((encoder, timestamps) => {
    beginTimestampRange(encoder, timestamps);
    for (let index = 0; index < repetitions; index++) {
      encoder.clearBuffer(rayBuffer);
    }
    endTimestampRange(encoder, timestamps);
  });
  const results = [];
  for (const slots of dirtySlots) {
    const boundedNative = await timeCommands((encoder, timestamps) => {
      beginTimestampRange(encoder, timestamps);
      if (slots > 0) {
        for (let index = 0; index < repetitions; index++) {
          encoder.clearBuffer(rayBuffer, 0, slots * rayBytes);
        }
      }
      endTimestampRange(encoder, timestamps);
    });
    device.queue.writeBuffer(indirectBuffer, 0, new Uint32Array([
      Math.ceil(slots / workgroupSize), 1, 1
    ]));
    const directFlags = await timeCommands((encoder, timestamps) => {
      beginTimestampRange(encoder, timestamps);
      for (let index = 0; index < repetitions; index++) {
        const pass = encoder.beginComputePass();
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.dispatchWorkgroups(Math.ceil(slots / workgroupSize));
        pass.end();
      }
      endTimestampRange(encoder, timestamps);
    });
    const indirectFlags = await timeCommands((encoder, timestamps) => {
      beginTimestampRange(encoder, timestamps);
      for (let index = 0; index < repetitions; index++) {
        const pass = encoder.beginComputePass();
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.dispatchWorkgroupsIndirect(indirectBuffer, 0);
        pass.end();
      }
      endTimestampRange(encoder, timestamps);
    });
    results.push({ slots, boundedNative, directFlags, indirectFlags });
  }
  const info = adapter.info ?? {};
  document.body.textContent = JSON.stringify({
    adapter: {
      vendor: info.vendor,
      architecture: info.architecture,
      device: info.device,
      description: info.description,
      isFallbackAdapter: adapter.isFallbackAdapter ?? null
    },
    capacity,
    rayBufferMiB: capacity * rayBytes / 1048576,
    repetitions,
    sampleCount,
    timestampQuery: hasTimestampQuery,
    fullNative,
    results
  });
  device.destroy();
} catch (error) {
  document.body.textContent = `ERROR: ${error?.stack ?? error}`;
}
</script>
